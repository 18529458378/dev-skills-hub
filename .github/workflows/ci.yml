name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install py_compile

      - name: Syntax check - code-gen
        run: |
          python -m py_compile code-gen/*.py

      - name: Syntax check - browser-search
        run: |
          python -m py_compile browser-search/*.py

      - name: Syntax check - crawler
        run: |
          python -m py_compile crawler/*.py

  powershell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path windows-cleanup -Filter *.ps1
          foreach ($file in $files) {
            $errors = $null
            $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $file.FullName -Raw), [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Error "Syntax errors in $($file.Name): $($errors.Count)"
              exit 1
            }
            Write-Host "OK: $($file.Name)"
          }
